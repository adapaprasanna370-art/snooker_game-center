
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Snooker Elite</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="navbar">
    <h2>♛ SNOOKER <span>ELITE</span></h2>
    <nav>
        <a href="/">Home</a>
        <a href="/login/">Login</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">

        <p class="tagline">JOIN THE CLUB</p>
        <h1>PLAYER <span>REGISTER</span></h1>

        {% if messages %}
            {% for message in messages %}
                <p style="color: #f3d77b; margin: 15px 0;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Create username"
                   required>

            <br><br>

            <input type="email"
                   name="email"
                   placeholder="Enter email address"
                   required>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>

            <br><br>

            <button type="submit" class="gold-btn">
                CREATE ACCOUNT
            </button>
        </form>

        <br>
        <p>Already have an account?</p>
        <a href="/login/" class="gold-btn">LOGIN</a>

        <br><br>
        <a href="/">Back to Home</a>

    </div>
</section>

</body>
</html>
